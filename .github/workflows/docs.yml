name: Deploy docs

on:
  push:
    tags:
      - "v*"
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "SPEC.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 0.1.7). Defaults to __version__ from src/augur_sdk/_version.py."
        required: false
        default: ""
      alias:
        description: "Alias to update (e.g. latest, dev). Empty = none."
        required: false
        default: "latest"

permissions:
  contents: write   # mike pushes to gh-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy versioned docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike needs full history of gh-pages

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync docs deps
        run: uv sync --frozen --group docs

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve version + alias
        id: ver
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "alias=latest"               >> "$GITHUB_OUTPUT"
            echo "mode=release"               >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
            if [[ -z "$V" ]]; then
              V=$(uv run python -c "from augur_sdk._version import __version__; print(__version__)")
            fi
            echo "version=$V"               >> "$GITHUB_OUTPUT"
            echo "alias=${{ inputs.alias }}" >> "$GITHUB_OUTPUT"
            echo "mode=manual"              >> "$GITHUB_OUTPUT"
          else
            # main push, not a tag — track unreleased work under `dev`
            echo "version=dev"  >> "$GITHUB_OUTPUT"
            echo "alias="        >> "$GITHUB_OUTPUT"
            echo "mode=dev"      >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ steps.ver.outputs.version }} (alias=${{ steps.ver.outputs.alias }})
        run: |
          set -eux
          VERSION="${{ steps.ver.outputs.version }}"
          ALIAS="${{ steps.ver.outputs.alias }}"
          if [[ -n "$ALIAS" ]]; then
            uv run mike deploy --push --update-aliases "$VERSION" "$ALIAS"
          else
            uv run mike deploy --push "$VERSION"
          fi

      - name: Pin default to `latest` on release
        if: steps.ver.outputs.mode == 'release' || steps.ver.outputs.alias == 'latest'
        run: uv run mike set-default --push latest
